name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile & unit test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # JDK 21, not 17: gradle/gradle-daemon-jvm.properties pins the daemon toolchain to 21.
      # (The compiled bytecode still targets 17 — see compileOptions in app/build.gradle.kts.)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Confirms gradle-wrapper.jar matches an official Gradle release before we execute it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # This step exists to accept the SDK licences; that is what lets AGP fetch the rest itself.
      # Deliberately not installing the platform — from API 37 the packages are named major.minor
      # (`platforms;android-37.0`), and which minor `compileSdk = 37` resolves to is AGP's call.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Compile
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Without this, a red build only shows the Gradle summary and not which assertion failed.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
