name: Release APK

# バージョンタグ（例: v2.0.0）を push すると、APK を自動ビルドして
# GitHub Releases に添付します。
on:
  push:
    tags:
      - 'v*'
  # 手動実行も可能（Actions タブから Run workflow）
  workflow_dispatch:

# Releases を作成・更新するために書き込み権限が必要
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # JDK 21: gradle/gradle-daemon-jvm.properties がデーモンのツールチェーンを 21 に固定している。
      # （生成されるバイトコードは 17 ターゲットのまま。app/build.gradle.kts の compileOptions を参照）
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # Secrets が未設定なら keystore.properties を作らない。
      # app/build.gradle.kts はその場合 signingConfig を空のままにするため、
      # ビルドは失敗せず「未署名 APK」になる。
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::署名用の Secrets が未設定のため、未署名 APK をビルドします。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > subkan-release.jks
          cat > keystore.properties <<EOF
          storeFile=subkan-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "リリース署名を設定しました。"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      # An unsigned APK cannot be installed, so shipping one to Releases would look like a
      # successful release and fail for every user who downloaded it. Fail here instead.
      #
      # Deliberately not limited to tag pushes: that is what makes a manual run a real rehearsal.
      # Secrets are the one part of a release that cannot be checked by building locally, so the
      # dry run has to be the thing that checks them.
      - name: Check the APK is signed
        run: |
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::署名済み APK がありません。リポジトリの Secrets" \
                 "(KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD) を確認してください。"
            ls -l app/build/outputs/apk/release/
            exit 1
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release*.apk \
            "dist/SubKan-${{ github.ref_name }}.apk"

      - name: Publish to GitHub Releases
        # タグ push 時のみリリースを作成（手動実行ではビルド確認のみ）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SubKan-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Upload APK as build artifact
        # 手動実行（タグ無し）でも成果物を確認できるようにする
        uses: actions/upload-artifact@v4
        with:
          name: SubKan-apk
          path: dist/*.apk
